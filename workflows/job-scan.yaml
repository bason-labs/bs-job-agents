# job-scan (spec §7.2): scheduled or from chat.
# Scan the sources, dedupe, score fit, keep the top jobs, then one pipeline per job:
# (once per run: refresh the CV guidance rules) → company → derive master facts → CV ⇄ QA ⇄ guidance review gate → Ba's review → Apply (needs the review's approval token) → record.
# Values starting with $ are templates the engine resolves ($params, $profile, $item, $steps.<key>.output).
# Bump `version` with every change: runs keep the version they started with (§7, rule 3).
name: job-scan
version: 3
description: Scan sources, score fit, then tailor, QA, review and apply per job.
triggers: [chat, schedule]
steps:
  # 1  map research.scan over the sources → JobCandidate[]
  - key: scan
    type: map
    over: $params.sources
    task:
      bot: research
      kind: scan
      input:
        source: $item
        criteria: $profile
  # 2  join (partial ok; failed sources are reported)
  - key: scan-join
    type: join
    of: scan
    requireAll: false
  # 3  filter dedupe vs the jobs table and applications
  - key: dedupe
    type: filter
    fn: dedupe
    from: scan-join
  # 4  map research.fit over the new candidates → FitScore
  - key: fit
    type: map
    over: $steps.dedupe.output
    task:
      bot: research
      kind: fit
      input:
        job: $item
  - key: fit-join
    type: join
    of: fit
  # 5  filter top: fit ≥ fitThreshold, best first, at most maxJobs
  - key: top
    type: filter
    fn: top
    from: fit-join
    options:
      threshold: $profile.fitThreshold
      take: $profile.maxJobs
  # 5b guidance (CV guidance, AD-12): once per run, before any branch step. Code re-fetches the known
  #    guidance pages (no LLM when nothing changed); a tool-less research.guidance_extract task reads
  #    only changed or new pages; a URL-only research.guidance_discover runs at most weekly. Optional:
  #    a failed refresh keeps the previous rule set and tailoring goes on. No top job, no refresh.
  - key: guidance
    type: task
    task:
      bot: research
      kind: guidance_extract
      input: {}
    optional: true
    skipIfEmpty: top

  # ── per selected job (parallel branches) ──
  # 6  research.company (a profile younger than 30 days is reused)
  - key: company
    type: task
    branch: top
    task:
      bot: research
      kind: company
      input:
        name: $item.company
        website: $item.companyWebsite
    cacheDays: 30
  # 6b derive (CV auto-extend): the job's gaps that Ba's facts support or imply become derived master
  #    facts before tailoring: the implication table first (no LLM), then at most one tool-less
  #    cv.derive task for what is left; none when the job has no gaps. Never fails the branch.
  - key: derive
    type: task
    branch: top
    task:
      bot: cv
      kind: derive
      input:
        job: $item
  # 7  gate cv.tailor ⇄ qa.review until total ≥ 80 and no hard fails, at most 3 rounds (VI JD: VI and EN).
  #    CV guidance: a truth check before QA fails the attempt (not a round); the guidance checkers run
  #    every round; cv.review runs only on a QA-passed round or the round handed to Ba; a fixable
  #    guidance miss asks for another round within the 3.
  - key: tailor
    type: gate
    branch: top
    producer:
      bot: cv
      kind: tailor
      input:
        job: $item
        company: $steps.company.output
    checker:
      bot: qa
      kind: review
      input:
        job: $item
        draft: $producer.output
    reviewer:
      bot: cv
      kind: review
      input: {}
    maxRounds: 3
    perLanguage: true
  # 8  human review: approve | request_changes(comment) → back to 7 | skip(reason)
  - key: review
    type: human
    branch: top
    kind: review
    decisions: [approve, request_changes, skip]
    onRequestChanges: tailor
  # 9  action apply.submit: requires the approval token from step 8
  - key: apply
    type: action
    branch: top
    task:
      bot: apply
      kind: submit
      input:
        approval: $steps.review.output
    approvalFrom: review
  # 10 record: application + submission record + JD snapshot, one transaction (§9.1)
  - key: record
    type: record
    branch: top
    fn: submission
