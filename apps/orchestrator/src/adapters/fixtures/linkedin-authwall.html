<!doctype html>
<!-- SYNTHETIC (hand-made, minimal): the shape of LinkedIn's sign-in wall as a guest sees it after too
     many page views (observed 2026-10 hint: a page whose canonical is /authwall or /login, with a
     "Join LinkedIn" / "Sign in" form and no job cards). Used by the blocked-detection tests.
     Not a captured page. -->
<html lang="en"><head><meta charset="utf-8"><title>Sign Up | LinkedIn</title><link rel="canonical" href="https://www.linkedin.com/authwall"></head>
<body class="authwall">
<main class="authwall-join-form">
<h1 class="authwall-join-form__title">Join LinkedIn to see more jobs</h1>
<form class="join-form"><button class="join-form__form-body-submit-button">Agree &amp; Join</button></form>
<p class="authwall-join-form__subtitle">Already on LinkedIn? <a href="https://www.linkedin.com/login">Sign in</a></p>
</main>
</body></html>
